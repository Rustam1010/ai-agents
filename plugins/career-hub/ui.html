<title>Career Hub</title>
<style>
:root{--ink:var(--foreground,#192d2a);--dim:var(--muted-foreground,#64746f);--line:var(--border,#dce5df);--panel:var(--card,#fff);--soft:var(--surface-recessed,#f3f6f3);--raised:var(--surface-raised,#f8faf8);--green:var(--brand,#176653);--on-green:var(--primary-foreground,#fff);--r:var(--radius,12px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:14px/1.5 var(--font-sans,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);background:transparent}
button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}

svg.icon{width:17px;height:17px;flex:none;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--dim)}.eyebrow{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:var(--dim)}
.row{display:flex;align-items:center;gap:9px}.spread{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:14px}.gap6{gap:6px}.mt{margin-top:16px}.mb{margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-weight:600;font-size:12px;text-decoration:none}
.btn:hover{background:var(--soft)}.btn.primary{background:var(--green);color:var(--on-green);border-color:transparent}.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{background:transparent;border-color:transparent}.btn.tiny{min-height:28px;padding:3px 8px;font-size:11px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-size:10px;font-weight:600;color:var(--dim);background:var(--panel)}
.chip.green{color:var(--green);background:color-mix(in srgb,var(--green) 7%,var(--panel));border-color:color-mix(in srgb,var(--green) 24%,var(--line))}
.chip.amber{color:var(--warning-text,#926522);background:color-mix(in srgb,var(--warning,#d49a3c) 8%,var(--panel))}
.tag{font-size:10px;color:var(--dim);background:var(--soft);border-radius:4px;padding:3px 6px}
.surface{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}.surface.soft{background:var(--soft)}
.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:24px 0 17px}.heading p{color:var(--dim);margin-top:7px;font-size:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.brandmark{background:var(--green);color:var(--on-green);width:34px;height:34px;display:grid;place-items:center;border-radius:10px}.brandmark svg{width:21px;height:21px}
.top{padding:5px 0 18px;border-bottom:1px solid var(--line)}.top .eyebrow{letter-spacing:.7px}.demo{font-size:11px;color:var(--dim);padding-top:8px}
.tabs{display:flex;gap:2px;overflow:auto;border-bottom:1px solid var(--line);padding:12px 0 0;scrollbar-width:thin}
.tab{background:transparent;border:0;color:var(--dim);font-weight:600;font-size:12px;display:flex;gap:6px;align-items:center;padding:12px 10px;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-current=page]{color:var(--green);border-bottom-color:var(--green)}.tab:hover{color:var(--ink)}.tabs .icon{width:15px;height:15px}
.number{font-size:27px;font-weight:500;line-height:1.1;letter-spacing:-1px;margin:8px 0}.stat{border-left:2px solid var(--line);padding-left:15px}.stat:first-child{border-color:var(--green)}
.stats{padding:18px 0 4px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.feature{padding:24px;background:color-mix(in srgb,var(--green) 6%,var(--panel));border:1px solid color-mix(in srgb,var(--green) 24%,var(--line));border-radius:var(--r)}
.feature h2{margin:12px 0 6px;max-width:420px;font-size:25px}.feature p{color:var(--dim);font-size:12px;max-width:430px}.feature .btn{margin-top:18px}
.task{padding:13px 0;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);align-items:center}.task:last-child{border-bottom:0;padding-bottom:0}
.datebox{display:flex;flex-direction:column;align-items:center;min-width:37px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--raised);font-size:9px;color:var(--dim)}.datebox strong{font-size:17px;color:var(--ink)}
.task-title{font-size:12px;font-weight:650}.task p{font-size:11px;color:var(--dim);margin-top:2px}.task-body{display:flex;gap:12px;align-items:center;min-width:0}
.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:15px 0;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:130px}.search .icon{position:absolute;top:10px;left:10px;color:var(--dim)}
input[type=text],input[type=date],textarea,select{color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 10px;max-width:100%;width:100%;font-size:12px}
.search input{padding-left:34px}select{width:auto;min-height:36px}textarea{resize:vertical;min-height:95px;line-height:1.5}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.column{padding:12px;background:var(--soft);border-radius:var(--r);min-width:0}
.colhead{font-size:11px;font-weight:700;display:flex;justify-content:space-between;gap:4px;margin-bottom:12px}
.job{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:block;width:100%;text-align:left;color:var(--ink);margin-bottom:9px;overflow-wrap:anywhere}
.job:hover,.job.active{border-color:var(--green)}.job .company{font-size:9px;color:var(--dim);display:block;margin-bottom:7px}
.job strong{display:block;font-size:12px;line-height:1.4}.job small{font-size:10px;display:block;margin:9px 0;color:var(--dim)}.job .chip{font-size:9px;max-width:100%}
.listjobs{display:grid;gap:8px}.listjobs .job{margin:0;display:flex;align-items:center;justify-content:space-between;gap:12px}.listjobs .job strong{margin-top:3px}
.detail{margin-top:18px;border-top:2px solid var(--green)}.detail h2{font-size:19px}.detail .desc{font-size:12px;color:var(--dim);margin:10px 0 16px}
.timeline{list-style:none;margin:0;padding:0}.timeline li{position:relative;padding:0 0 18px 18px;border-left:1px solid var(--line);font-size:12px;overflow-wrap:anywhere}
.timeline li:before{content:"";position:absolute;width:7px;height:7px;left:-4px;top:6px;border-radius:50%;background:var(--green)}.timeline li:last-child{padding-bottom:0}
.timeline small{display:block;color:var(--dim);font-size:10px;margin-bottom:3px}.hint{font-size:11px;color:var(--dim);line-height:1.6}
.story{padding:17px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-wrap:anywhere}
.story p{font-size:12px;color:var(--dim);margin:8px 0 12px}.story details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:12px}
.story summary{font-size:11px;cursor:pointer;color:var(--green);font-weight:600}
.story dl{margin:12px 0 0;display:grid;grid-template-columns:75px minmax(0,1fr);gap:8px;font-size:11px}.story dt{color:var(--dim)}.story dd{margin:0}
.profile{padding:18px 20px;background:var(--soft);border-radius:var(--r);margin-bottom:16px}
.avatar{width:38px;height:38px;flex:none;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;border-radius:50%;font-weight:650;font-size:12px}
.resume-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:16px;align-items:start}
.sectionlabel{font-size:12px;font-weight:700;margin:0 0 10px}.requirement{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;background:var(--panel)}
.requirement .quote{font-size:11px;color:var(--dim);margin:5px 0 8px}.requirement h3{font-size:12px}.coverage{font-size:10px;font-weight:650;color:var(--green)}.coverage.gap{color:var(--warning-text,#926522)}
.pick{display:flex;gap:9px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pick input{accent-color:var(--green);margin:4px 0 0;flex:none;width:15px;height:15px}.pick strong{font-size:11px;display:block}.pick small{font-size:10px;color:var(--dim);display:block;margin-top:3px}.pick.disabled{opacity:.55;cursor:default}
.paper{padding:24px 22px;background:var(--panel);border:1px solid var(--line);border-radius:3px;box-shadow:0 3px 16px #00000005}
.paper .resume-name{font-size:20px;font-weight:650;letter-spacing:-.7px;margin-bottom:3px}.paper .resume-title{font-size:11px;color:var(--green);font-weight:600;margin-bottom:12px}
.paper .resume-contact{font-size:9px;color:var(--dim);padding-bottom:13px;border-bottom:1px solid var(--line);margin-bottom:13px}
.paper h3{font-size:10px;letter-spacing:1px;text-transform:uppercase;margin:16px 0 8px}.paper p,.paper li{font-size:10px;line-height:1.7}
.paper ul{padding-left:14px;margin:7px 0}.paper .employment{font-size:11px;font-weight:650}.paper .period{font-size:9px;color:var(--dim)}
.source-link{border:0;padding:0 2px;color:var(--green);background:transparent;font-size:8px;vertical-align:super;cursor:pointer}
.version{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0;gap:9px}.version:last-child{border:0}.version p{font-size:11px;font-weight:600}.version small{font-size:10px;color:var(--dim)}
.star{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.star:last-child{border:0}
.letter{width:27px;height:27px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--green) 8%,var(--panel));color:var(--green);font-size:11px;font-weight:700}
.star p{font-size:12px}.star .eyebrow{font-size:9px;margin-bottom:3px}.empty{padding:22px;text-align:center;font-size:12px;color:var(--dim);border:1px dashed var(--line);border-radius:9px}
.count{font-size:10px;background:var(--panel);border-radius:4px;padding:0 5px;color:var(--dim)}.footer{font-size:10px;color:var(--dim);padding:20px 0 5px;border-top:1px solid var(--line);margin-top:24px}.footer span{display:block;margin-top:3px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);max-width:92%;padding:12px 17px;background:var(--ink);color:var(--panel);border-radius:9px;font-size:12px;z-index:20;pointer-events:none;box-shadow:var(--shadow-md,0 5px 20px #0002)}#toast:empty{display:none}
dialog{border:1px solid var(--line);border-radius:var(--r);padding:24px;width:540px;max-width:94%;max-height:min(650px,calc(100dvh - 24px));overflow:auto;background:var(--panel);color:var(--ink);box-shadow:var(--shadow-lg,0 14px 50px #0002)}
dialog::backdrop{background:#0e242855}dialog h2{font-size:19px;margin-bottom:8px}dialog form{display:flex;flex-direction:column;gap:13px}
dialog .modal-close{position:absolute;top:12px;right:12px}dialog textarea.document{font-family:var(--font-mono,monospace);font-size:11px;min-height:300px}
#screen{min-height:620px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
*[hidden]{display:none!important}
.job h3{font-size:12px}.job-actions{margin-top:12px}.job-actions .btn{font-size:10px;padding:3px 6px}
.listjobs .job{display:block}.listjobs .job .company{font-size:11px}.listjobs .job h3{font-size:15px}
.source-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.source-card{padding:17px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow-wrap:anywhere}
.source-card h3{font-size:13px;margin-top:13px}.source-card .hint{margin-top:8px}.dropzone{border-style:dashed;border-color:var(--green)}
.machine-review{border-color:color-mix(in srgb,var(--green) 30%,var(--line));background:color-mix(in srgb,var(--green) 4%,var(--panel))}
.screening-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.screening-grid strong{font-size:11px;display:block}.screening-grid p{font-size:11px;color:var(--dim);margin-top:5px}
.requirements-fold{border:1px solid var(--line);border-radius:8px;padding:13px}
.requirements-fold summary{font-size:12px;font-weight:650;cursor:pointer;color:var(--green)}
.requirements-fold .requirement{margin-top:12px}.compact-story{border-bottom:1px solid var(--line);padding-bottom:7px}
.compact-story .pick{border:0;padding-bottom:5px}.compact-story .pick strong{font-weight:500;line-height:1.6;font-size:12px}
.merge-conflict{padding:17px;border:1px solid color-mix(in srgb,var(--warning,#d49a3c) 35%,var(--line));border-radius:9px}
.source-text{min-height:200px}dialog h2{padding-right:24px}
.master-cv{padding:26px;overflow-wrap:anywhere}
.master-header{padding-bottom:20px;border-bottom:1px solid var(--line)}.master-header h2{font-size:26px}
.master-contact{font-size:12px;color:var(--dim);margin-top:8px;white-space:pre-wrap}
.master-section{margin-top:24px}.master-section>h3,.master-section>.row>h3{font-size:11px;letter-spacing:1px;text-transform:uppercase}
.master-prose{font-size:12px;line-height:1.8;white-space:pre-wrap;margin-top:10px}
.master-employment{margin-top:20px;padding-top:17px;border-top:1px solid var(--line)}
.master-employment h3{font-size:15px}.master-employment .period{font-size:11px;color:var(--dim);margin-top:3px}
.master-story{margin-top:17px;padding:17px;background:var(--soft);border-radius:9px}
.master-story h4{margin:0;font-size:13px}.master-story dl{margin:13px 0 0;display:grid;grid-template-columns:80px minmax(0,1fr);gap:9px;font-size:12px}
.master-story dt{color:var(--dim)}.master-story dd{margin:0;white-space:pre-wrap;line-height:1.7}
.master-source{font-size:10px;color:var(--dim);margin-top:12px}.master-skill-list{margin-top:12px}
.master-edit-section{padding:15px;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;gap:10px;margin:10px 0}

@media(max-width:620px){.master-cv{padding:18px}.master-story{padding:13px}.master-story dl{grid-template-columns:1fr;gap:4px}.master-story dd{margin-bottom:8px}.master-header h2{font-size:23px}}
@media(max-width:620px){.source-grid,.screening-grid{grid-template-columns:1fr}.screening-grid{gap:12px}.job-actions .btn{font-size:11px}}

 :root{--ink:var(--foreground,#e3ece6);--dim:var(--muted-foreground,#9bab9f);--line:var(--border,#344238);--panel:var(--card,#19251e);--soft:var(--surface-recessed,#142019);--raised:var(--surface-raised,#202f25);--green:var(--brand,#83cbb0);--on-green:var(--primary-foreground,#10251c)}
 .chip.amber,.coverage.gap{color:var(--warning-text,#d8b36e)}
}

@media(max-width:360px){.board{grid-template-columns:1fr}.top .eyebrow{font-size:9px}.tabs .icon{display:none}.top .btn .icon{display:none}.btn{font-size:11px}.heading{flex-wrap:wrap}}
html,body{background:var(--background,#111);min-height:100%;}body{padding:16px}nav.tabs{position:sticky;top:0;z-index:3;background:var(--background,#111)}.proposal-json{white-space:pre-wrap;overflow:auto;max-height:320px;padding:14px;border:1px solid var(--line);border-radius:8px;font-size:11px}.compact-paper{padding:22px}.compact-paper p,.compact-paper li{font-size:11px;line-height:1.35}.compact-paper h3{margin-top:13px}
</style>
</head>

function sentenceCount(text){
 if(!text.trim())return 0;
 if(typeof Intl.Segmenter==="function")return Array.from(new Intl.Segmenter("en",{granularity:"sentence"}).segment(text)).filter(s=>s.segment.trim()).length;
 return text.trim().split(/[.!?]+\s+/).filter(Boolean).length;
}
function compact(s){return ((state.cvWording[state.target]||{})[s.id]||s.bullet).trim()}
function sourceLabel(source){return {cv:"CV",linkedin:"LinkedIn",prep:"Interview case",manual:"Manual"}[source.type]||"Source"}
function validCompact(s){return compact(s).length>0&&sentenceCount(compact(s))<=2}
function picked(){return stories.filter(s=>state.selected.has(s.id)&&s.approved)}
function target(){return targets[state.target]||{company:"",role:"",requirements:[]}}
function groupsFor(selection){
 const groups=new Map();
 selection.forEach(s=>{const key=s.company+" · "+s.role+" · "+s.period;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(s)});
 return Array.from(groups.entries());
}
function cvText(selection=picked(),t=target()){
 const focus=Array.from(new Set(selection.map(s=>s.focus).filter(Boolean)));
 let text=profile.name.toUpperCase()+"\nTarget role: "+t.role+"\n"+profile.location+" · "+profile.email+(profile.linkedin?" · "+profile.linkedin:"")+"\n\nPROFILE\n";
 text+=profile.headline+(focus.length?" with experience in "+focus.join(", ")+".":".");
 text+="\n\nEXPERIENCE\n";
 groupsFor(selection).forEach(([key,items])=>{text+=key+"\n"+items.map(s=>"• "+compact(s)).join("\n")+"\n\n"});
 return text.trim();
}

 '<div class="toolbar"><div class="row gap6 wrap">'+btn("Master CV","experience-tab",master?"primary":"",'data-id="master"')+btn("Sources","experience-tab",state.experienceTab==="sources"?"primary":"",'data-id="sources"')+btn("Stories","experience-tab",state.experienceTab==="stories"?"primary":"",'data-id="stories"')+'</div><span class="hint">Sources → review → full profile</span></div>'+

function renderMasterStory(story){

}

function machineReview(selection){

 const must=target().requirements.filter(r=>r.level==="Must-have");
 const full=must.filter(r=>r.story&&state.selected.has(r.story)&&!r.partial).length;
 const gaps=target().requirements.filter(r=>!r.story||!state.selected.has(r.story));
 return '<section class="machine-review surface"><div class="row spread wrap"><h3>'+icon("check")+' ATS &amp; AI screening</h3>'+btn("Read as plain text","preview-text","tiny")+'</div><p class="small muted mt">Make your CV easy to parse and your relevant experience easy to identify.</p><div class="screening-grid mt"><div><strong>Readable structure</strong><p>One column, clear headings and text-based content.</p></div><div><strong>'+(short?"Concise achievement bullets":"Review achievement bullets")+'</strong><p>One sentence preferred. Two sentences maximum per story.</p></div><div><strong>Evidence-backed role language</strong><p>'+full+' of '+must.length+' must-have criteria supported; partial evidence stays labelled.</p></div></div>'+(gaps.length?'<p class="hint mt">Review gaps: '+esc(gaps.map(r=>r.title).join(", "))+'. Add a term only when your experience supports it.</p>':"")+'<p class="hint mt">These checks support readability and relevance. Employer systems and criteria vary; this is not a hiring score.</p></section>';
}

async function importCVs(files){
 let added=0;
 for(const file of Array.from(files).slice(0,10)){
  if(file.size>10*1024*1024){toast("File exceeds 10 MB: "+file.name);continue}
  const ext=file.name.split(".").pop().toLowerCase();if(!["pdf","docx","txt","md"].includes(ext)){toast("Unsupported CV format: "+file.name);continue}
  const fingerprint=file.name+":"+file.size+":"+file.lastModified;
  if(state.sources.some(s=>s.fingerprint===fingerprint))continue;
  const source={id:uid("source"),type:"cv",name:file.name,status:"Awaiting extraction",note:"Original file added",storyIds:[],fingerprint};
  if(["txt","md"].includes(ext)){
   try{source.text=await file.text();if(source.text.length>200000){source.text="";source.status="Needs smaller text";source.note="Text exceeds the prototype review limit."}else{source.status="Needs review";source.note="Text ready for review"}}catch(error){source.status="Read failed";source.note="Try adding the source again."}
  }
  state.sources.push(source);added++;
 }
 state.view="stories";state.experienceTab="sources";render();toast(added?added+" CV sources added. Review before merging.":"No new CV sources added.");
}
